name: Validate

# Every change runs the same checks: a syntax check, then the real tests against one throwaway
# MySQL, plus the browser tests. No job picking: everything runs every time.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASS: safeharbor-test-root
      # Each test family gets its own database on the same throwaway server.
      CUSTOMER_SIGNUP_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=signup_test_portal;charset=utf8mb4
      CUSTOMER_SIGNUP_TEST_PASS: safeharbor-test-root
      SUPPORT_MAIL_TEST_DSN: mysql:host=127.0.0.1;dbname=support_mail_test
      SUPPORT_MAIL_TEST_PASS: safeharbor-test-root
      SUPPORT_INTAKE_DISPOSABLE: '1'
      SAFEHARBOR_SSO_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_SSO_TEST_DB: safeharbor_sso_test
      SAFEHARBOR_SSO_TEST_HOST: 127.0.0.1
      SAFEHARBOR_SSO_TEST_PORT: 3306
      SAFEHARBOR_SSO_TEST_USER: root
      SAFEHARBOR_SSO_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_WESTY_TEST_DB: safeharbor_westy_test
      SAFEHARBOR_WESTY_TEST_HOST: 127.0.0.1
      SAFEHARBOR_WESTY_TEST_PORT: 3306
      SAFEHARBOR_WESTY_TEST_USER: root
      SAFEHARBOR_WESTY_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_TIME_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_TIME_TEST_DB: safeharbor_time_test
      SAFEHARBOR_TIME_TEST_HOST: 127.0.0.1
      SAFEHARBOR_TIME_TEST_PORT: 3306
      SAFEHARBOR_TIME_TEST_USER: root
      SAFEHARBOR_TIME_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_TIME_ADJUSTMENT_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_TIME_ADJUSTMENT_TEST_DB: safeharbor_time_adjustment_test
      SAFEHARBOR_TIME_ADJUSTMENT_TEST_HOST: 127.0.0.1
      SAFEHARBOR_TIME_ADJUSTMENT_TEST_PORT: 3306
      SAFEHARBOR_TIME_ADJUSTMENT_TEST_USER: root
      SAFEHARBOR_TIME_ADJUSTMENT_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_COASTMARK_V3_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_COASTMARK_V3_TEST_DB: safeharbor_coastmark_v3_test
      SAFEHARBOR_COASTMARK_V3_TEST_HOST: 127.0.0.1
      SAFEHARBOR_COASTMARK_V3_TEST_PORT: 3306
      SAFEHARBOR_COASTMARK_V3_TEST_USER: root
      SAFEHARBOR_COASTMARK_V3_TEST_PASS: safeharbor-test-root
      MILEPOST_TEST_DB_HOST: 127.0.0.1
      MILEPOST_TEST_DB_NAME: milepost_safeharbor_test
      MILEPOST_TEST_DB_ALLOW_DROP: 'YES'
      MILEPOST_TEST_DB_PASS: safeharbor-test-root
      SAFEHARBOR_SVC_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_SVC_TEST_DB: safeharbor_svc_test
      SAFEHARBOR_SVC_TEST_HOST: 127.0.0.1
      SAFEHARBOR_SVC_TEST_PORT: 3306
      SAFEHARBOR_SVC_TEST_USER: root
      SAFEHARBOR_SVC_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_AUTO_CLOSE_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_AUTO_CLOSE_TEST_DB: safeharbor_auto_close_test
      SAFEHARBOR_AUTO_CLOSE_TEST_HOST: 127.0.0.1
      SAFEHARBOR_AUTO_CLOSE_TEST_PORT: 3306
      SAFEHARBOR_AUTO_CLOSE_TEST_USER: root
      SAFEHARBOR_AUTO_CLOSE_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_PORTAL_TEST_DB: safeharbor_portal_test
      SAFEHARBOR_PORTAL_TEST_HOST: 127.0.0.1
      SAFEHARBOR_PORTAL_TEST_PORT: 3306
      SAFEHARBOR_PORTAL_TEST_USER: root
      SAFEHARBOR_PORTAL_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_SERVICE_GOAL_TEST_DB: safeharbor_service_goal_test
      SAFEHARBOR_SERVICE_GOAL_TEST_HOST: 127.0.0.1
      SAFEHARBOR_SERVICE_GOAL_TEST_PORT: 3306
      SAFEHARBOR_SERVICE_GOAL_TEST_USER: root
      SAFEHARBOR_SERVICE_GOAL_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_REPORT_TEST_DB: safeharbor_report_test
      SAFEHARBOR_REPORT_TEST_HOST: 127.0.0.1
      SAFEHARBOR_REPORT_TEST_PORT: 3306
      SAFEHARBOR_REPORT_TEST_USER: root
      SAFEHARBOR_REPORT_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_ID_REPORT_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_ID_REPORT_TEST_DB: safeharbor_id_report_test
      SAFEHARBOR_ID_REPORT_TEST_HOST: 127.0.0.1
      SAFEHARBOR_ID_REPORT_TEST_PORT: 3306
      SAFEHARBOR_ID_REPORT_TEST_USER: root
      SAFEHARBOR_ID_REPORT_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_CUSTOMER_SYNC_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_CUSTOMER_SYNC_TEST_DB: safeharbor_customer_sync_test
      SAFEHARBOR_CUSTOMER_SYNC_TEST_HOST: 127.0.0.1
      SAFEHARBOR_CUSTOMER_SYNC_TEST_PORT: 3306
      SAFEHARBOR_CUSTOMER_SYNC_TEST_USER: root
      SAFEHARBOR_CUSTOMER_SYNC_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_ACTIVATION_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_ACTIVATION_TEST_DB: safeharbor_activation_test
      SAFEHARBOR_ACTIVATION_TEST_HOST: 127.0.0.1
      SAFEHARBOR_ACTIVATION_TEST_PORT: 3306
      SAFEHARBOR_ACTIVATION_TEST_USER: root
      SAFEHARBOR_ACTIVATION_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_LIFECYCLE_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_LIFECYCLE_TEST_DB: safeharbor_lifecycle_test
      SAFEHARBOR_LIFECYCLE_TEST_HOST: 127.0.0.1
      SAFEHARBOR_LIFECYCLE_TEST_PORT: 3306
      SAFEHARBOR_LIFECYCLE_TEST_USER: root
      SAFEHARBOR_LIFECYCLE_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_CENTRAL_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_CENTRAL_TEST_DB: safeharbor_central_test
      SAFEHARBOR_CENTRAL_TEST_HOST: 127.0.0.1
      SAFEHARBOR_CENTRAL_TEST_PORT: 3306
      SAFEHARBOR_CENTRAL_TEST_USER: root
      SAFEHARBOR_CENTRAL_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_TICKET_DELETE_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_TICKET_DELETE_TEST_DB: safeharbor_ticket_delete_test
      SAFEHARBOR_TICKET_DELETE_TEST_HOST: 127.0.0.1
      SAFEHARBOR_TICKET_DELETE_TEST_PORT: 3306
      SAFEHARBOR_TICKET_DELETE_TEST_USER: root
      SAFEHARBOR_TICKET_DELETE_TEST_PASS: safeharbor-test-root
      SAFEHARBOR_CSRF_TEST_DISPOSABLE_SERVER: '1'
      SAFEHARBOR_CSRF_TEST_DB: safeharbor_csrf_test
      SAFEHARBOR_CSRF_TEST_HOST: 127.0.0.1
      SAFEHARBOR_CSRF_TEST_PORT: 3306
      SAFEHARBOR_CSRF_TEST_USER: root
      SAFEHARBOR_CSRF_TEST_PASS: safeharbor-test-root
    steps:
      - uses: actions/checkout@v4

      - name: No server settings file in git
        run: test ! -f app/config/config.php

      - name: Syntax check (PHP and shell)
        run: |
          find app -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n

      # In memory and without the binary log: the schema loads in seconds instead of minutes.
      - name: Start a throwaway MySQL
        run: |
          docker run -d --name mysql -p 127.0.0.1:3306:3306 --tmpfs /var/lib/mysql:rw,size=2g \
            -e MYSQL_ROOT_PASSWORD="$DB_PASS" -e MYSQL_DATABASE=safeharbor_portal_test \
            mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b \
            --skip-log-bin --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0
          for i in $(seq 1 90); do
            if mysqladmin ping -h 127.0.0.1 -uroot -p"$DB_PASS" --silent 2> /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs mysql
          exit 1

      - name: Tests without a settings file
        run: |
          php app/tests/suite_auth_policy_test.php
          php app/tests/suite_chrome_test.php
          php app/tests/suite_revocation_test.php
          php app/tests/private_file_cache_test.php
          php app/tests/trusted_jwks_test.php
          php app/tests/trusted_jwks_https_test.php
          php app/tests/private_revocation_io_test.php
          php app/tests/suite_logout_test.php
          php app/tests/suite_rs256_test.php
          php app/tests/suite_roles_test.php
          php app/tests/suite_preferences_test.php
          php app/tests/ai_federation_test.php
          php app/tests/tenant_ai_catalog_test.php
          php app/tests/portal_auth_test.php
          php app/tests/portal_login_test.php
          php app/tests/portal_data_test.php
          php app/tests/portal_settings_test.php
          php app/tests/portal_customer_entry_test.php
          php app/tests/portal_companion_branding_test.php
          php app/tests/tenant_branding_test.php
          php app/tests/portal_ticket_workflow_test.php
          php app/tests/portal_report_archive_test.php
          php app/tests/portal_computer_time_test.php
          php app/tests/portal_westy_mac_companion_test.php
          php app/tests/portal_westy_ai_receipt_test.php
          php app/tests/portal_westy_desktop_continuation_test.php
          php app/tests/portal_westy_desktop_diagnostics_test.php
          php app/tests/portal_westy_desktop_recovery_test.php
          php app/tests/desktop_renewal_test.php
          php app/tests/desktop_return_path_test.php
          php app/tests/client_operational_context_test.php
          php app/tests/logbook_export_test.php
          php app/tests/ticket_bulk_delete_render_test.php
          php app/tests/westy_workflow_test.php
          php app/tests/westy_billing_test.php
          php app/tests/westy_queue_owner_test.php
          php app/tests/westy_mail_graph_test.php
          php app/tests/westy_mail_poll_test.php
          php app/tests/service_goals_test.php
          php app/tests/service_goal_policy_admin_test.php
          php app/tests/time_entries_test.php
          php app/tests/time_entry_adjustments_test.php
          php app/tests/coastmark_time_export_test.php
          php app/tests/business_reports_test.php
          php app/tests/id_report_contacts_test.php
          php app/tests/managed_customer_id_evidence_test.php
          php app/tests/managed_customer_activation_test.php
          php app/tests/managed_customer_lifecycle_test.php
          php app/tests/managed_customer_lifecycle_scheduler_test.php
          php app/tests/suite_customer_sync_test.php
          php app/tests/ticket_auto_close_contract_test.php
          sudo php app/tests/desktop_cleanup_readiness_test.php
          sudo bash app/tests/business_report_wrapper_linux_test.sh

      - name: Database tests
        run: |
          mysql -h 127.0.0.1 -uroot -p"$DB_PASS" -e 'CREATE DATABASE signup_test_portal CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; CREATE DATABASE support_mail_test'
          php app/tests/customer_signup_portal_mysql_test.php
          php app/tests/suite_workspace_provisioning_test.php
          php app/tests/support_addresses_test.php
          php app/tests/support_mail_poll_test.php
          php app/tests/support_mailer_test.php
          php app/tests/westy_workflow_mysql_test.php
          php app/tests/westy_email_mysql_test.php
          php app/tests/westy_mail_mysql_test.php
          php app/tests/westy_mail_poll_mysql_test.php
          php app/tests/portal_westy_mysql_test.php
          php app/tests/portal_westy_ai_delivery_mysql_test.php
          php app/tests/portal_westy_feedback_mysql_test.php
          php app/tests/portal_devices_mysql_test.php
          php app/tests/portal_employee_device_access_mysql_test.php
          php app/tests/portal_access_mysql_test.php
          php app/tests/portal_workspace_mysql_test.php
          php app/tests/portal_stream_http_test.php
          php app/tests/portal_security_orders_test.php
          SAFEHARBOR_WESTY_TEST_DB=safeharbor_westy_test_mobile php app/tests/portal_mobile_test.php
          SAFEHARBOR_WESTY_TEST_DB=safeharbor_westy_test_mobile php app/tests/portal_mobile_mysql_test.php
          php app/tests/portal_mysql_test.php
          php app/tests/portal_requester_http_test.php
          php app/tests/csat_http_test.php
          php app/tests/time_entries_mysql_test.php
          php app/tests/time_corrections_mysql_test.php
          php app/tests/time_entry_adjustments_mysql_test.php
          php app/tests/coastmark_time_export_mysql_test.php
          php app/tests/desktop_renewal_mysql_test.php
          php app/tests/ticket_auto_close_mysql_test.php
          php app/tests/service_goal_policy_mysql_test.php
          php app/tests/business_reports_mysql_test.php
          php app/tests/id_report_contacts_mysql_test.php
          php app/tests/suite_customer_sync_mysql_test.php
          php app/tests/managed_customer_activation_mysql_test.php
          php app/tests/managed_customer_lifecycle_mysql_test.php
          php app/tests/central_issues_mysql_test.php
          php app/tests/ticket_delete_mysql_test.php
          php app/tests/ticket_bulk_delete_http_test.php
          php app/tests/csrf_http_test.php

      # These run as the web server's user, the way the runtime does, from a copy it can read.
      - name: Westy tests as the web user
        run: |
          sudo install -d -o 0 -g 0 -m 0750 /etc/8west
          sudo install -d -o 0 -g 0 -m 0755 /etc/8west/php /run/8west-desktop-cleanup
          sudo setfacl -m u:33:--x,m::r-x /etc/8west
          sudo install -d -o 33 -g 33 -m 0700 /run/8west-desktop-cleanup/milepost /run/8west-desktop-cleanup/safeharbor
          echo '{"schema":"8west-selected-runtime-identities-v1","apps":{"milepost":{"mode":"legacy","user":"www-data","group":"www-data","uid":33,"gid":33},"safeharbor":{"mode":"legacy","user":"www-data","group":"www-data","uid":33,"gid":33}}}' \
            | sudo tee /etc/8west/php/runtime-identities.json > /dev/null
          sudo chmod 0644 /etc/8west/php/runtime-identities.json
          copy="$(mktemp -d)"
          chmod 0755 "$copy"
          git archive HEAD | tar -x -C "$copy"
          cd "$copy"
          keep=SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER,SAFEHARBOR_WESTY_TEST_DB,SAFEHARBOR_WESTY_TEST_HOST,SAFEHARBOR_WESTY_TEST_PORT,SAFEHARBOR_WESTY_TEST_USER,SAFEHARBOR_WESTY_TEST_PASS
          sudo -u www-data -g www-data --preserve-env="$keep" php app/tests/portal_westy_runs_mysql_test.php
          sudo -u www-data -g www-data --preserve-env="$keep" php app/tests/portal_westy_control_mysql_test.php

      # Made from config.sample.php with the throwaway database login, and deleted afterwards.
      - name: Tests that need a settings file
        run: |
          php -r '$c = require "app/config/config.sample.php"; $c["db"]["user"] = "root"; $c["db"]["pass"] = getenv("DB_PASS"); file_put_contents("app/config/config.php", "<?php\nreturn " . var_export($c, true) . ";\n");'
          trap 'rm -f app/config/config.php' EXIT
          mysql -h 127.0.0.1 -uroot -p"$DB_PASS" -e 'CREATE DATABASE safeharbor_test'
          php app/tests/utf8_input_test.php
          php app/tests/support_intake_scope_test.php
          php app/tests/suite_sso_test.php
          php app/tests/svc_intake_test.php
          php app/tests/svc_support_test.php
          php app/tests/westy_report_test.php
          php app/tests/intake_service_goal_test.php
          php app/tests/mail_loop_guard_test.php

      - name: No settings file left behind
        if: always()
        run: test ! -f app/config/config.php

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/shots/package-lock.json
      - name: Install the browser test tools
        working-directory: tools/shots
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          node tools/shots/time-contract.test.mjs
          node tools/shots/portal-contract.test.mjs
          node tools/shots/portal-settings.test.mjs
          node tools/shots/client-shared-directory.test.mjs
          node tools/shots/destructive-confirm.test.mjs
          node tools/shots/suite-settings.test.mjs
          node tools/shots/portal-reply-actions.test.mjs
          node tools/shots/westy-workflow-contract.test.mjs
          node tools/shots/ticket-bulk-delete-contract.test.mjs
          node --test tools/shots/computer-time-contract.test.mjs
