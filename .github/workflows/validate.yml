        run: php app/tests/central_issues_mysql_test.php
      - name: Reject shard runtime config after tests
        if: always()
        run: test ! -f app/config/config.php

  # Keep the existing public status even when selection fails or shards skip.
  php:
    needs: [changes, php-core, php-westy-control, php-westy-portal, php-time, php-customers]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected PHP shard
        env:
          PHP_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B .github/scripts/ci_php_result.py

  tool-runs-protected-cli:
    needs: changes
    if: needs.changes.outputs.protected_cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        volumes:
          - /var/run/mysqld:/var/run/mysqld
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Execute root-only backup, apply, repeat, drift and lock contracts
        run: |
          sudo env SAFEHARBOR_TOOL_RUNS_CLI_TEST=1 \
            SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER=1 \
            SAFEHARBOR_WESTY_TEST_DB=safeharbor_westy_test_cli \
            SAFEHARBOR_WESTY_TEST_HOST=127.0.0.1 \
            SAFEHARBOR_WESTY_TEST_USER=root \
            php app/tests/endpoint_tool_runs_cli_mysql_test.php
          sudo env SAFEHARBOR_TOOL_RUNS_CLI_TEST=1 \
            SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER=1 \
            SAFEHARBOR_WESTY_TEST_DB=safeharbor_westy_test_cli_v2 \
            SAFEHARBOR_WESTY_TEST_HOST=127.0.0.1 \
            SAFEHARBOR_WESTY_TEST_USER=root \
            php app/tests/endpoint_tool_runs_v2_cli_mysql_test.php
