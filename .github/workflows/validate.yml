name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: safeharbor-test-root
          MYSQL_DATABASE: safeharbor_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psafeharbor-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test suite authentication policy
        run: php app/tests/suite_auth_policy_test.php
      - name: Test suite authorization-session revocation
        run: php app/tests/suite_revocation_test.php
      - name: Test suite admission before database writes
        env:
          SAFEHARBOR_SSO_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_SSO_TEST_DB: safeharbor_sso_test
          SAFEHARBOR_SSO_TEST_HOST: 127.0.0.1
          SAFEHARBOR_SSO_TEST_PORT: 3306
          SAFEHARBOR_SSO_TEST_USER: root
          SAFEHARBOR_SSO_TEST_PASS: safeharbor-test-root
        run: |
          test ! -e app/config/config.php
          cp app/config/config.sample.php app/config/config.php
          trap 'rm -f app/config/config.php' EXIT
          php app/tests/suite_sso_test.php
      - name: Test central suite logout
        run: php app/tests/suite_logout_test.php
      - name: Test suite token algorithms
        run: php app/tests/suite_rs256_test.php
      - name: Test suite roles
        run: php app/tests/suite_roles_test.php
      - name: Test suite preferences
        run: php app/tests/suite_preferences_test.php
      - name: Test service goals
        run: php app/tests/service_goals_test.php
      - name: Test service-goal policy publication
        run: php app/tests/service_goal_policy_admin_test.php
      - name: Test time provenance bridge
        run: php app/tests/time_provenance_bridge_test.php
      - name: Test approval-grade technician time
        run: php app/tests/time_entries_test.php
      - name: Test approval-grade time migration and database guards
        env:
          SAFEHARBOR_TIME_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_TIME_TEST_DB: safeharbor_time_test
          SAFEHARBOR_TIME_TEST_HOST: 127.0.0.1
          SAFEHARBOR_TIME_TEST_PORT: 3306
          SAFEHARBOR_TIME_TEST_USER: root
          SAFEHARBOR_TIME_TEST_PASS: safeharbor-test-root
        run: php app/tests/time_entries_mysql_test.php
      - name: Test time corrections and measured overlap races
        env:
          SAFEHARBOR_TIME_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_TIME_TEST_DB: safeharbor_time_test
          SAFEHARBOR_TIME_TEST_HOST: 127.0.0.1
          SAFEHARBOR_TIME_TEST_PORT: 3306
          SAFEHARBOR_TIME_TEST_USER: root
          SAFEHARBOR_TIME_TEST_PASS: safeharbor-test-root
        run: php app/tests/time_corrections_mysql_test.php
      - name: Test Coastmark approved-time export contract
        run: php app/tests/coastmark_time_export_test.php
      - name: Test customer portal authentication and revocation
        run: php app/tests/portal_auth_test.php
      - name: Test customer portal boundary and rendering
        run: php app/tests/portal_data_test.php
      - name: Test customer portal ticket workflow
        run: php app/tests/portal_ticket_workflow_test.php
      - name: Test scheduled archived business reports
        run: php app/tests/business_reports_test.php
      - name: Test 8 West ID report-contact client contract
        run: php app/tests/id_report_contacts_test.php
      - name: Test Milepost customer-sync contract
        run: php app/tests/suite_customer_sync_test.php
      - name: Test signed Milepost alert intake handler
        env:
          SAFEHARBOR_SVC_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_SVC_TEST_DB: safeharbor_svc_test
          SAFEHARBOR_SVC_TEST_HOST: 127.0.0.1
          SAFEHARBOR_SVC_TEST_PORT: 3306
          SAFEHARBOR_SVC_TEST_USER: root
          SAFEHARBOR_SVC_TEST_PASS: safeharbor-test-root
        run: |
          test ! -e app/config/config.php
          cp app/config/config.sample.php app/config/config.php
          trap 'rm -f app/config/config.php' EXIT
          php app/tests/svc_intake_test.php
      - name: Test ticket automatic-closure ownership contract
        run: php app/tests/ticket_auto_close_contract_test.php
      - name: Test ticket automatic-closure migration and guards
        env:
          SAFEHARBOR_AUTO_CLOSE_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_AUTO_CLOSE_TEST_DB: safeharbor_auto_close_test
          SAFEHARBOR_AUTO_CLOSE_TEST_HOST: 127.0.0.1
          SAFEHARBOR_AUTO_CLOSE_TEST_PORT: 3306
          SAFEHARBOR_AUTO_CLOSE_TEST_USER: root
          SAFEHARBOR_AUTO_CLOSE_TEST_PASS: safeharbor-test-root
        run: php app/tests/ticket_auto_close_mysql_test.php
      - name: Test customer portal migration and tenant isolation
        env:
          SAFEHARBOR_PORTAL_TEST_DB: safeharbor_portal_test
          SAFEHARBOR_PORTAL_TEST_HOST: 127.0.0.1
          SAFEHARBOR_PORTAL_TEST_PORT: 3306
          SAFEHARBOR_PORTAL_TEST_USER: root
          SAFEHARBOR_PORTAL_TEST_PASS: safeharbor-test-root
        run: php app/tests/portal_mysql_test.php
      - name: Test service-goal policy migration and publication guards
        env:
          SAFEHARBOR_SERVICE_GOAL_TEST_DB: safeharbor_service_goal_test
          SAFEHARBOR_SERVICE_GOAL_TEST_HOST: 127.0.0.1
          SAFEHARBOR_SERVICE_GOAL_TEST_PORT: 3306
          SAFEHARBOR_SERVICE_GOAL_TEST_USER: root
          SAFEHARBOR_SERVICE_GOAL_TEST_PASS: safeharbor-test-root
        run: php app/tests/service_goal_policy_mysql_test.php
      - name: Test business report migration and delivery state machine
        env:
          SAFEHARBOR_REPORT_TEST_DB: safeharbor_report_test
          SAFEHARBOR_REPORT_TEST_HOST: 127.0.0.1
          SAFEHARBOR_REPORT_TEST_PORT: 3306
          SAFEHARBOR_REPORT_TEST_USER: root
          SAFEHARBOR_REPORT_TEST_PASS: safeharbor-test-root
        run: php app/tests/business_reports_mysql_test.php
      - name: Test ID report-contact evidence migration and runtime guards
        env:
          SAFEHARBOR_ID_REPORT_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_ID_REPORT_TEST_DB: safeharbor_id_report_test
          SAFEHARBOR_ID_REPORT_TEST_HOST: 127.0.0.1
          SAFEHARBOR_ID_REPORT_TEST_PORT: 3306
          SAFEHARBOR_ID_REPORT_TEST_USER: root
          SAFEHARBOR_ID_REPORT_TEST_PASS: safeharbor-test-root
        run: php app/tests/id_report_contacts_mysql_test.php
      - name: Test customer-sync migration, receipts, and preserved history
        env:
          SAFEHARBOR_CUSTOMER_SYNC_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_CUSTOMER_SYNC_TEST_DB: safeharbor_customer_sync_test
          SAFEHARBOR_CUSTOMER_SYNC_TEST_HOST: 127.0.0.1
          SAFEHARBOR_CUSTOMER_SYNC_TEST_PORT: 3306
          SAFEHARBOR_CUSTOMER_SYNC_TEST_USER: root
          SAFEHARBOR_CUSTOMER_SYNC_TEST_PASS: safeharbor-test-root
        run: php app/tests/suite_customer_sync_mysql_test.php
      - name: Reject committed runtime config
        run: test ! -f app/config/config.php
