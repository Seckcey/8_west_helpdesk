name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: safeharbor-test-root
          MYSQL_DATABASE: safeharbor_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psafeharbor-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test suite authentication policy
        run: php app/tests/suite_auth_policy_test.php
      - name: Test central suite logout
        run: php app/tests/suite_logout_test.php
      - name: Test suite token algorithms
        run: php app/tests/suite_rs256_test.php
      - name: Test suite roles
        run: php app/tests/suite_roles_test.php
      - name: Test suite preferences
        run: php app/tests/suite_preferences_test.php
      - name: Test service goals
        run: php app/tests/service_goals_test.php
      - name: Test service-goal policy publication
        run: php app/tests/service_goal_policy_admin_test.php
      - name: Test time provenance bridge
        run: php app/tests/time_provenance_bridge_test.php
      - name: Test approval-grade technician time
        run: php app/tests/time_entries_test.php
      - name: Test Coastmark approved-time export contract
        run: php app/tests/coastmark_time_export_test.php
      - name: Test customer portal authentication and revocation
        run: php app/tests/portal_auth_test.php
      - name: Test customer portal read-only boundary and rendering
        run: php app/tests/portal_data_test.php
      - name: Test scheduled archived business reports
        run: php app/tests/business_reports_test.php
      - name: Test customer portal migration and tenant isolation
        env:
          SAFEHARBOR_PORTAL_TEST_DB: safeharbor_portal_test
          SAFEHARBOR_PORTAL_TEST_HOST: 127.0.0.1
          SAFEHARBOR_PORTAL_TEST_PORT: 3306
          SAFEHARBOR_PORTAL_TEST_USER: root
          SAFEHARBOR_PORTAL_TEST_PASS: safeharbor-test-root
        run: php app/tests/portal_mysql_test.php
      - name: Test service-goal policy migration and publication guards
        env:
          SAFEHARBOR_SERVICE_GOAL_TEST_DB: safeharbor_service_goal_test
          SAFEHARBOR_SERVICE_GOAL_TEST_HOST: 127.0.0.1
          SAFEHARBOR_SERVICE_GOAL_TEST_PORT: 3306
          SAFEHARBOR_SERVICE_GOAL_TEST_USER: root
          SAFEHARBOR_SERVICE_GOAL_TEST_PASS: safeharbor-test-root
        run: php app/tests/service_goal_policy_mysql_test.php
      - name: Test business report migration and delivery state machine
        env:
          SAFEHARBOR_REPORT_TEST_DB: safeharbor_report_test
          SAFEHARBOR_REPORT_TEST_HOST: 127.0.0.1
          SAFEHARBOR_REPORT_TEST_PORT: 3306
          SAFEHARBOR_REPORT_TEST_USER: root
          SAFEHARBOR_REPORT_TEST_PASS: safeharbor-test-root
        run: php app/tests/business_reports_mysql_test.php
      - name: Reject committed runtime config
        run: test ! -f app/config/config.php
