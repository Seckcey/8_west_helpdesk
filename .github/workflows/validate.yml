name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      php: ${{ steps.select.outputs.php }}
      browser: ${{ steps.select.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI change selection
        run: python3 -B .github/scripts/test_ci_changes.py
      - name: Reject committed runtime config
        run: test ! -f app/config/config.php
      - name: Select validation jobs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/ci_changes.py
  browser-contracts:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/shots/package-lock.json
      - name: Install browser contract dependencies
        working-directory: tools/shots
        run: npm ci --ignore-scripts
      - name: Install Chromium for browser contracts
        working-directory: tools/shots
        run: npx playwright install --with-deps chromium
      - name: Test technician-time retry contracts in a real browser
        run: node tools/shots/time-contract.test.mjs
      - name: Test customer portal usefulness in a real browser
        run: node tools/shots/portal-contract.test.mjs
      - name: Test Westy ownership and reply guidance in a real browser
        run: node tools/shots/westy-workflow-contract.test.mjs
      - name: Test selected-computer timezone contracts
        run: node --test tools/shots/computer-time-contract.test.mjs

  php:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: safeharbor-test-root
          MYSQL_DATABASE: safeharbor_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psafeharbor-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test tenant AI receipts and protected release contracts
        env:
          TENANT_AI_TEST_DISPOSABLE_SERVER: '1'
          TENANT_AI_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=tenant_ai_test_safeharbor;charset=utf8mb4
          TENANT_AI_TEST_PASS: safeharbor-test-root
        run: |
          find deploy -maxdepth 1 -name 'tenant_ai_*.php' -print0 | xargs -0 -n1 php -l
          php app/tests/portal_westy_ai_receipt_test.php
          php app/tests/tenant_ai_catalog_test.php
          sudo env TENANT_AI_TEST_DISPOSABLE_SERVER=1 php app/tests/tenant_ai_release_lock_test.php
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy -p 'test_tenant_ai_*.py'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -psafeharbor-test-root -e 'CREATE DATABASE tenant_ai_test_safeharbor CHARACTER SET utf8mb4 COLLATE utf8mb4_bin'
          php tools/capture_tenant_ai_schema.php > "$RUNNER_TEMP/tenant-ai-schema.json"
          php app/tests/tenant_ai_migration_db_test.php
      - name: Test verified business signup portal binding with restricted database account
        env:
          CUSTOMER_SIGNUP_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=signup_test_portal;charset=utf8mb4
          CUSTOMER_SIGNUP_TEST_PASS: safeharbor-test-root
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -psafeharbor-test-root -e 'CREATE DATABASE signup_test_portal CHARACTER SET utf8mb4 COLLATE utf8mb4_bin'
          php app/tests/customer_signup_portal_mysql_test.php
      - name: Test suite authentication policy
        run: php app/tests/suite_auth_policy_test.php
      - name: Test automatic workspace and isolated support intake
        env:
          SUPPORT_MAIL_TEST_DSN: mysql:host=127.0.0.1;dbname=support_mail_test
          SUPPORT_MAIL_TEST_PASS: safeharbor-test-root
          SUPPORT_INTAKE_DISPOSABLE: '1'
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -psafeharbor-test-root -e 'CREATE DATABASE support_mail_test'
          php app/tests/suite_workspace_provisioning_test.php
          php app/tests/support_addresses_test.php
          php app/tests/support_mail_poll_test.php
          php app/tests/support_mailer_test.php
          test ! -e app/config/config.php
          cp app/config/config.sample.php app/config/config.php
          trap 'rm -f app/config/config.php' EXIT
          php app/tests/support_intake_scope_test.php
      - name: Test the vendored 8 West IT 365 chrome is exactly the pinned release
        run: php app/tests/w365_vendored_test.php
      - name: Test the suite app drawer and account menu
        run: php app/tests/suite_chrome_test.php
      - name: Test suite authorization-session revocation
        run: php app/tests/suite_revocation_test.php
      - name: Test suite admission before database writes
        env:
          SAFEHARBOR_SSO_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_SSO_TEST_DB: safeharbor_sso_test
          SAFEHARBOR_SSO_TEST_HOST: 127.0.0.1
          SAFEHARBOR_SSO_TEST_PORT: 3306
          SAFEHARBOR_SSO_TEST_USER: root
          SAFEHARBOR_SSO_TEST_PASS: safeharbor-test-root
        run: |
          test ! -e app/config/config.php
          cp app/config/config.sample.php app/config/config.php
          trap 'rm -f app/config/config.php' EXIT
          php app/tests/suite_sso_test.php
      - name: Test central suite logout
        run: php app/tests/suite_logout_test.php
      - name: Test read-only Logbook knowledge export
        run: php app/tests/logbook_export_test.php
      - name: Test Westy controller workflow contract
        run: |
          php app/tests/westy_workflow_test.php
          php app/tests/westy_billing_test.php
          php app/tests/westy_queue_owner_test.php
      - name: Test Westy workflow migration, replay, and human ownership
        env:
          SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_WESTY_TEST_DB: safeharbor_westy_test
          SAFEHARBOR_WESTY_TEST_HOST: 127.0.0.1
          SAFEHARBOR_WESTY_TEST_PORT: 3306
          SAFEHARBOR_WESTY_TEST_USER: root
          SAFEHARBOR_WESTY_TEST_PASS: safeharbor-test-root
        run: |
          php app/tests/westy_workflow_mysql_test.php
          php app/tests/westy_email_mysql_test.php
          php app/tests/westy_mail_mysql_test.php
          php app/tests/westy_mail_poll_mysql_test.php
          php app/tests/portal_westy_mysql_test.php
          php app/tests/portal_westy_ai_delivery_mysql_test.php
          sudo install -d -m 0700 -o "$(id -u)" /run/8west-desktop-cleanup
          php app/tests/portal_westy_runs_mysql_test.php
          php app/tests/endpoint_tool_runs_migration_mysql_test.php
          php app/tests/endpoint_tool_runs_v2_migration_mysql_test.php
          php app/tests/portal_westy_control_mysql_test.php
          php app/tests/portal_devices_mysql_test.php
          php app/tests/portal_access_mysql_test.php
          php app/tests/portal_workspace_mysql_test.php
          php app/tests/portal_stream_http_test.php
          php app/tests/portal_security_orders_test.php
      - name: Test dedicated Westy Graph transport and reply intake
        run: |
          php app/tests/westy_mail_graph_test.php
          php app/tests/westy_mail_poll_test.php
      - name: Test suite token algorithms
        run: php app/tests/suite_rs256_test.php
      - name: Test suite roles
        run: php app/tests/suite_roles_test.php
      - name: Test suite preferences
        run: php app/tests/suite_preferences_test.php
      - name: Test service goals
        run: php app/tests/service_goals_test.php
      - name: Test service-goal policy publication
        run: php app/tests/service_goal_policy_admin_test.php
      - name: Test time provenance bridge
        run: php app/tests/time_provenance_bridge_test.php
      - name: Test approval-grade technician time
        run: php app/tests/time_entries_test.php
      - name: Test append-only approved-time adjustments
        run: php app/tests/time_entry_adjustments_test.php
      - name: Test approval-grade time migration and database guards
        env:
          SAFEHARBOR_TIME_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_TIME_TEST_DB: safeharbor_time_test
          SAFEHARBOR_TIME_TEST_HOST: 127.0.0.1
          SAFEHARBOR_TIME_TEST_PORT: 3306
          SAFEHARBOR_TIME_TEST_USER: root
          SAFEHARBOR_TIME_TEST_PASS: safeharbor-test-root
        run: php app/tests/time_entries_mysql_test.php
      - name: Test time corrections and measured overlap races
        env:
          SAFEHARBOR_TIME_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_TIME_TEST_DB: safeharbor_time_test
          SAFEHARBOR_TIME_TEST_HOST: 127.0.0.1
          SAFEHARBOR_TIME_TEST_PORT: 3306
          SAFEHARBOR_TIME_TEST_USER: root
          SAFEHARBOR_TIME_TEST_PASS: safeharbor-test-root
        run: php app/tests/time_corrections_mysql_test.php
      - name: Test approved-time adjustment migration, guards, and version race
        env:
          SAFEHARBOR_TIME_ADJUSTMENT_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_TIME_ADJUSTMENT_TEST_DB: safeharbor_time_adjustment_test
          SAFEHARBOR_TIME_ADJUSTMENT_TEST_HOST: 127.0.0.1
          SAFEHARBOR_TIME_ADJUSTMENT_TEST_PORT: 3306
          SAFEHARBOR_TIME_ADJUSTMENT_TEST_USER: root
          SAFEHARBOR_TIME_ADJUSTMENT_TEST_PASS: safeharbor-test-root
        run: php app/tests/time_entry_adjustments_mysql_test.php
      - name: Test Coastmark approved-time export contract
        run: php app/tests/coastmark_time_export_test.php
      - name: Test Coastmark v3 export migration, locking, and least privilege
        env:
          SAFEHARBOR_COASTMARK_V3_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_COASTMARK_V3_TEST_DB: safeharbor_coastmark_v3_test
          SAFEHARBOR_COASTMARK_V3_TEST_HOST: 127.0.0.1
          SAFEHARBOR_COASTMARK_V3_TEST_PORT: 3306
          SAFEHARBOR_COASTMARK_V3_TEST_USER: root
          SAFEHARBOR_COASTMARK_V3_TEST_PASS: safeharbor-test-root
        run: php app/tests/coastmark_time_export_mysql_test.php
      - name: Test customer portal authentication and revocation
        run: |
          php app/tests/portal_auth_test.php
          php app/tests/portal_login_test.php
      - name: Test customer portal boundary and rendering
        run: |
          php app/tests/portal_data_test.php
          php app/tests/portal_companion_branding_test.php
      - name: Test desktop cleanup readiness without a database
        run: php app/tests/desktop_cleanup_readiness_test.php
      - name: Test desktop renewal provenance without a database
        run: php app/tests/desktop_renewal_test.php
      - name: Test desktop renewal handoff and session authority
        env:
          MILEPOST_TEST_DB_HOST: 127.0.0.1
          MILEPOST_TEST_DB_NAME: milepost_safeharbor_test
          MILEPOST_TEST_DB_ALLOW_DROP: 'YES'
          MILEPOST_TEST_DB_PASS: safeharbor-test-root
        run: php app/tests/desktop_renewal_mysql_test.php
      - name: Test customer portal ticket workflow
        run: php app/tests/portal_ticket_workflow_test.php
      - name: Test customer portal weekly archive access
        run: php app/tests/portal_report_archive_test.php
      - name: Test scheduled archived business reports
        run: |
          bash -n app/cron/run_business_reports.sh
          bash -n deploy/manage-business-report-scheduler.sh
          bash -n deploy/hash-safeharbor-app-artifact.sh
          bash -n deploy/remote-install-safeharbor-app.sh
          bash -n deploy/deploy.sh
          php app/tests/business_reports_test.php
          sudo bash app/tests/business_report_scheduler_linux_test.sh
      - name: Test 8 West ID report-contact client contract
        run: php app/tests/id_report_contacts_test.php
      - name: Test managed-customer activation contract
        run: |
          php app/tests/managed_customer_id_evidence_test.php
          php app/tests/managed_customer_activation_test.php
          php app/tests/managed_customer_lifecycle_test.php
      - name: Test Milepost customer-sync contract
        run: php app/tests/suite_customer_sync_test.php
      - name: Test signed Milepost alert intake handler
        env:
          SAFEHARBOR_SVC_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_SVC_TEST_DB: safeharbor_svc_test
          SAFEHARBOR_SVC_TEST_HOST: 127.0.0.1
          SAFEHARBOR_SVC_TEST_PORT: 3306
          SAFEHARBOR_SVC_TEST_USER: root
          SAFEHARBOR_SVC_TEST_PASS: safeharbor-test-root
        run: |
          test ! -e app/config/config.php
          cp app/config/config.sample.php app/config/config.php
          trap 'rm -f app/config/config.php' EXIT
          php app/tests/svc_intake_test.php
      - name: Test ticket automatic-closure ownership contract
        run: php app/tests/ticket_auto_close_contract_test.php
      - name: Test ticket automatic-closure migration and guards
        env:
          SAFEHARBOR_AUTO_CLOSE_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_AUTO_CLOSE_TEST_DB: safeharbor_auto_close_test
          SAFEHARBOR_AUTO_CLOSE_TEST_HOST: 127.0.0.1
          SAFEHARBOR_AUTO_CLOSE_TEST_PORT: 3306
          SAFEHARBOR_AUTO_CLOSE_TEST_USER: root
          SAFEHARBOR_AUTO_CLOSE_TEST_PASS: safeharbor-test-root
        run: php app/tests/ticket_auto_close_mysql_test.php
      - name: Test customer portal migration and tenant isolation
        env:
          SAFEHARBOR_PORTAL_TEST_DB: safeharbor_portal_test
          SAFEHARBOR_PORTAL_TEST_HOST: 127.0.0.1
          SAFEHARBOR_PORTAL_TEST_PORT: 3306
          SAFEHARBOR_PORTAL_TEST_USER: root
          SAFEHARBOR_PORTAL_TEST_PASS: safeharbor-test-root
        run: php app/tests/portal_mysql_test.php
      - name: Test service-goal policy migration and publication guards
        env:
          SAFEHARBOR_SERVICE_GOAL_TEST_DB: safeharbor_service_goal_test
          SAFEHARBOR_SERVICE_GOAL_TEST_HOST: 127.0.0.1
          SAFEHARBOR_SERVICE_GOAL_TEST_PORT: 3306
          SAFEHARBOR_SERVICE_GOAL_TEST_USER: root
          SAFEHARBOR_SERVICE_GOAL_TEST_PASS: safeharbor-test-root
        run: php app/tests/service_goal_policy_mysql_test.php
      - name: Test business report migration and delivery state machine
        env:
          SAFEHARBOR_REPORT_TEST_DB: safeharbor_report_test
          SAFEHARBOR_REPORT_TEST_HOST: 127.0.0.1
          SAFEHARBOR_REPORT_TEST_PORT: 3306
          SAFEHARBOR_REPORT_TEST_USER: root
          SAFEHARBOR_REPORT_TEST_PASS: safeharbor-test-root
        run: php app/tests/business_reports_mysql_test.php
      - name: Test ID report-contact evidence migration and runtime guards
        env:
          SAFEHARBOR_ID_REPORT_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_ID_REPORT_TEST_DB: safeharbor_id_report_test
          SAFEHARBOR_ID_REPORT_TEST_HOST: 127.0.0.1
          SAFEHARBOR_ID_REPORT_TEST_PORT: 3306
          SAFEHARBOR_ID_REPORT_TEST_USER: root
          SAFEHARBOR_ID_REPORT_TEST_PASS: safeharbor-test-root
        run: php app/tests/id_report_contacts_mysql_test.php
      - name: Test customer-sync migration, receipts, and preserved history
        env:
          SAFEHARBOR_CUSTOMER_SYNC_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_CUSTOMER_SYNC_TEST_DB: safeharbor_customer_sync_test
          SAFEHARBOR_CUSTOMER_SYNC_TEST_HOST: 127.0.0.1
          SAFEHARBOR_CUSTOMER_SYNC_TEST_PORT: 3306
          SAFEHARBOR_CUSTOMER_SYNC_TEST_USER: root
          SAFEHARBOR_CUSTOMER_SYNC_TEST_PASS: safeharbor-test-root
        run: php app/tests/suite_customer_sync_mysql_test.php
      - name: Test managed-customer activation migration and worker race
        env:
          SAFEHARBOR_ACTIVATION_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_ACTIVATION_TEST_DB: safeharbor_activation_test
          SAFEHARBOR_ACTIVATION_TEST_HOST: 127.0.0.1
          SAFEHARBOR_ACTIVATION_TEST_PORT: 3306
          SAFEHARBOR_ACTIVATION_TEST_USER: root
          SAFEHARBOR_ACTIVATION_TEST_PASS: safeharbor-test-root
        run: php app/tests/managed_customer_activation_mysql_test.php
      - name: Test managed-customer lifecycle migration, rollback, and worker race
        env:
          SAFEHARBOR_LIFECYCLE_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_LIFECYCLE_TEST_DB: safeharbor_lifecycle_test
          SAFEHARBOR_LIFECYCLE_TEST_HOST: 127.0.0.1
          SAFEHARBOR_LIFECYCLE_TEST_PORT: 3306
          SAFEHARBOR_LIFECYCLE_TEST_USER: root
          SAFEHARBOR_LIFECYCLE_TEST_PASS: safeharbor-test-root
        run: php app/tests/managed_customer_lifecycle_mysql_test.php
      - name: Test Central private history, isolation, replay and erasure
        env:
          SAFEHARBOR_CENTRAL_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_CENTRAL_TEST_DB: safeharbor_central_test
          SAFEHARBOR_CENTRAL_TEST_HOST: 127.0.0.1
          SAFEHARBOR_CENTRAL_TEST_PORT: 3306
          SAFEHARBOR_CENTRAL_TEST_USER: root
          SAFEHARBOR_CENTRAL_TEST_PASS: safeharbor-test-root
        run: php app/tests/central_issues_mysql_test.php
      - name: Reject committed runtime config
        run: test ! -f app/config/config.php

  tool-runs-protected-cli:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        volumes:
          - /var/run/mysqld:/var/run/mysqld
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Execute root-only backup, apply, repeat, drift and lock contracts
        run: |
          sudo env SAFEHARBOR_TOOL_RUNS_CLI_TEST=1 \
            SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER=1 \
            SAFEHARBOR_WESTY_TEST_DB=safeharbor_westy_test_cli \
            SAFEHARBOR_WESTY_TEST_HOST=127.0.0.1 \
            SAFEHARBOR_WESTY_TEST_USER=root \
            php app/tests/endpoint_tool_runs_cli_mysql_test.php
          sudo env SAFEHARBOR_TOOL_RUNS_CLI_TEST=1 \
            SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER=1 \
            SAFEHARBOR_WESTY_TEST_DB=safeharbor_westy_test_cli_v2 \
            SAFEHARBOR_WESTY_TEST_HOST=127.0.0.1 \
            SAFEHARBOR_WESTY_TEST_USER=root \
            php app/tests/endpoint_tool_runs_v2_cli_mysql_test.php
