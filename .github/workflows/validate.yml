name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      php: ${{ steps.select.outputs.php }}
      browser: ${{ steps.select.outputs.browser }}
      protected_cli: ${{ steps.select.outputs.protected_cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI change selection
        run: python3 -B .github/scripts/test_ci_changes.py
      - name: Test PHP aggregation failure and intentional-skip cases
        run: python3 -B .github/scripts/test_ci_php_result.py
      - name: Reject committed runtime config
        run: test ! -f app/config/config.php
      - name: Select validation jobs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/ci_changes.py
  browser-contracts:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/shots/package-lock.json
      - name: Install browser contract dependencies
        working-directory: tools/shots
        run: npm ci --ignore-scripts
      - name: Install Chromium for browser contracts
        working-directory: tools/shots
        run: npx playwright install --with-deps chromium
      - name: Test technician-time retry contracts in a real browser
        run: node tools/shots/time-contract.test.mjs
      - name: Test customer portal usefulness in a real browser
        run: node tools/shots/portal-contract.test.mjs
      - name: Test private Westy reply Copy and feedback in a real browser
        run: node tools/shots/portal-reply-actions.test.mjs
      - name: Test Westy ownership and reply guidance in a real browser
        run: node tools/shots/westy-workflow-contract.test.mjs
      - name: Test selected-computer timezone contracts
        run: node --test tools/shots/computer-time-contract.test.mjs

  # Each shard gets a separate hosted runner, checkout, MySQL service and /tmp.
  php-core:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: safeharbor-test-root
          MYSQL_DATABASE: safeharbor_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psafeharbor-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test tenant AI receipts and protected release contracts
        env:
          TENANT_AI_TEST_DISPOSABLE_SERVER: '1'
          TENANT_AI_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=tenant_ai_test_safeharbor;charset=utf8mb4
          TENANT_AI_TEST_PASS: safeharbor-test-root
        run: |
          find deploy -maxdepth 1 -name 'tenant_ai_*.php' -print0 | xargs -0 -n1 php -l
          php app/tests/portal_westy_ai_receipt_test.php
          php app/tests/tenant_ai_catalog_test.php
          php app/tests/portal_westy_desktop_continuation_test.php
          sudo env TENANT_AI_TEST_DISPOSABLE_SERVER=1 php app/tests/tenant_ai_release_lock_test.php
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy -p 'test_tenant_ai_*.py'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -psafeharbor-test-root -e 'CREATE DATABASE tenant_ai_test_safeharbor CHARACTER SET utf8mb4 COLLATE utf8mb4_bin'
          php tools/capture_tenant_ai_schema.php > "$RUNNER_TEMP/tenant-ai-schema.json"
          php app/tests/tenant_ai_migration_db_test.php
      - name: Test verified business signup portal binding with restricted database account
        env:
          CUSTOMER_SIGNUP_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=signup_test_portal;charset=utf8mb4
          CUSTOMER_SIGNUP_TEST_PASS: safeharbor-test-root
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -psafeharbor-test-root -e 'CREATE DATABASE signup_test_portal CHARACTER SET utf8mb4 COLLATE utf8mb4_bin'
          php app/tests/customer_signup_portal_mysql_test.php
      - name: Test suite authentication policy
        run: php app/tests/suite_auth_policy_test.php
      - name: Test automatic workspace and isolated support intake
        env:
          SUPPORT_MAIL_TEST_DSN: mysql:host=127.0.0.1;dbname=support_mail_test
          SUPPORT_MAIL_TEST_PASS: safeharbor-test-root
          SUPPORT_INTAKE_DISPOSABLE: '1'
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -psafeharbor-test-root -e 'CREATE DATABASE support_mail_test'
          php app/tests/suite_workspace_provisioning_test.php
          php app/tests/support_addresses_test.php
          php app/tests/support_mail_poll_test.php
          php app/tests/support_mailer_test.php
          test ! -e app/config/config.php
          cp app/config/config.sample.php app/config/config.php
          trap 'rm -f app/config/config.php' EXIT
          php app/tests/support_intake_scope_test.php
      - name: Test the vendored 8 West IT 365 chrome is exactly the pinned release
        run: php app/tests/w365_vendored_test.php
      - name: Test the suite app drawer and account menu
        run: php app/tests/suite_chrome_test.php
      - name: Test suite authorization-session revocation
        run: |
          php app/tests/suite_revocation_test.php
          php app/tests/private_file_cache_test.php
          php app/tests/trusted_jwks_test.php
          php app/tests/trusted_jwks_https_test.php
          php app/tests/private_revocation_io_test.php
      - name: Test suite admission before database writes
        env:
          SAFEHARBOR_SSO_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_SSO_TEST_DB: safeharbor_sso_test
          SAFEHARBOR_SSO_TEST_HOST: 127.0.0.1
          SAFEHARBOR_SSO_TEST_PORT: 3306
          SAFEHARBOR_SSO_TEST_USER: root
          SAFEHARBOR_SSO_TEST_PASS: safeharbor-test-root
        run: |
          test ! -e app/config/config.php
          cp app/config/config.sample.php app/config/config.php
          trap 'rm -f app/config/config.php' EXIT
          php app/tests/suite_sso_test.php
      - name: Test central suite logout
        run: php app/tests/suite_logout_test.php
      - name: Test read-only Logbook knowledge export
        run: php app/tests/logbook_export_test.php
      - name: Test Westy controller workflow contract
        run: |
          php app/tests/westy_workflow_test.php
          php app/tests/westy_billing_test.php
          php app/tests/westy_queue_owner_test.php
      - name: Test dedicated Westy Graph transport and reply intake
        run: |
          php app/tests/westy_mail_graph_test.php
          php app/tests/westy_mail_poll_test.php
      - name: Test suite token algorithms
        run: php app/tests/suite_rs256_test.php
      - name: Test suite roles
        run: php app/tests/suite_roles_test.php
      - name: Test suite preferences
        run: php app/tests/suite_preferences_test.php
      - name: Test customer portal authentication and revocation
        run: |
          php app/tests/portal_auth_test.php
          php app/tests/portal_login_test.php
      - name: Test customer portal boundary and rendering
        run: |
          php app/tests/portal_data_test.php
          php app/tests/portal_companion_branding_test.php
          php app/tests/tenant_branding_test.php
      - name: Test desktop cleanup readiness without a database
        run: sudo php app/tests/desktop_cleanup_readiness_test.php
      - name: Test desktop renewal provenance without a database
        run: php app/tests/desktop_renewal_test.php
      - name: Test Westy Companion for Mac instructions without a database
        run: php app/tests/portal_westy_mac_companion_test.php
      - name: Test customer portal ticket workflow
        run: php app/tests/portal_ticket_workflow_test.php
      - name: Test customer portal weekly archive access
        run: php app/tests/portal_report_archive_test.php
      - name: Reject committed runtime config
        if: always()
        run: test ! -f app/config/config.php

  php-westy-control:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: safeharbor-test-root
          MYSQL_DATABASE: safeharbor_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psafeharbor-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Test Westy tool continuation, migrations, and control ownership
        env:
          SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_WESTY_TEST_DB: safeharbor_westy_test
          SAFEHARBOR_WESTY_TEST_HOST: 127.0.0.1
          SAFEHARBOR_WESTY_TEST_PORT: 3306
          SAFEHARBOR_WESTY_TEST_USER: root
          SAFEHARBOR_WESTY_TEST_PASS: safeharbor-test-root
        run: |
          set -o pipefail
          test "$(id -u www-data):$(id -g www-data)" = 33:33 || { echo 'FAIL readiness preflight: www-data UID/GID must be33:33' >&2; exit 1; }
          test -x /usr/bin/getfacl || { echo 'FAIL readiness preflight: /usr/bin/getfacl unavailable' >&2; exit 1; }
          test -x /usr/bin/setfacl || { echo 'FAIL readiness preflight: /usr/bin/setfacl unavailable' >&2; exit 1; }
          { test ! -e /etc/8west && test ! -L /etc/8west; } || { echo 'FAIL readiness preflight: refusing existing /etc/8west authority' >&2; exit 1; }
          { test ! -e /run/8west-desktop-cleanup && test ! -L /run/8west-desktop-cleanup; } || { echo 'FAIL readiness preflight: refusing existing cleanup runtime root' >&2; exit 1; }
          sudo install -d -o 0 -g 0 -m 0750 /etc/8west
          sudo install -d -o 0 -g 0 -m 0755 /etc/8west/php /run/8west-desktop-cleanup
          sudo setfacl -m u:33:--x,m::r-x /etc/8west
          sudo install -d -o 33 -g 33 -m 0700 /run/8west-desktop-cleanup/milepost /run/8west-desktop-cleanup/safeharbor
          printf '%s\n' '{"schema":"8west-selected-runtime-identities-v1","apps":{"milepost":{"mode":"legacy","user":"www-data","group":"www-data","uid":33,"gid":33},"safeharbor":{"mode":"legacy","user":"www-data","group":"www-data","uid":33,"gid":33}}}' | sudo tee /etc/8west/php/runtime-identities.json > /dev/null
          sudo chmod 0644 /etc/8west/php/runtime-identities.json
          fixture_checkout="$PWD"
          fixture_copy=''
          trap '
            fixture_exit=$?
            sudo rm -f /etc/8west/php/runtime-identities.json || fixture_exit=1
            sudo rmdir /run/8west-desktop-cleanup/milepost /run/8west-desktop-cleanup/safeharbor /run/8west-desktop-cleanup /etc/8west/php /etc/8west || fixture_exit=1
            if test -n "$fixture_copy"; then
              case "$fixture_copy" in
                /tmp/safeharbor-readiness-ci.????????)
                  if test -d "$fixture_copy" && test ! -L "$fixture_copy" && test "$(realpath -e -- "$fixture_copy")" = "$fixture_copy"; then
                    rm -rf -- "$fixture_copy" || fixture_exit=1
                  else echo "FAIL readiness cleanup: copy path is no longer the owned physical directory" >&2; fixture_exit=1; fi ;;
                *) echo "FAIL readiness cleanup: copy path outside task prefix" >&2; fixture_exit=1 ;;
              esac
            fi
            exit "$fixture_exit"
          ' EXIT
          if ! sudo -u www-data -g www-data test -r "$fixture_checkout/app/tests/portal_westy_runs_mysql_test.php" \
            || ! sudo -u www-data -g www-data test -r "$fixture_checkout/app/tests/portal_westy_control_mysql_test.php"; then
            echo 'Readiness preflight: original checkout unreadable as33; preparing tracked-HEAD test copy'
            if git cat-file -e HEAD:app/config/config.php 2>/dev/null; then
              echo 'FAIL readiness copy: tracked runtime config is forbidden' >&2; exit 1
            fi
            fixture_copy="$(mktemp -d /tmp/safeharbor-readiness-ci.XXXXXXXX)"
            case "$fixture_copy" in /tmp/safeharbor-readiness-ci.????????) ;; *) echo 'FAIL readiness copy: invalid task prefix' >&2; exit 1 ;; esac
            { test ! -L "$fixture_copy" && test "$(realpath -e -- "$fixture_copy")" = "$fixture_copy"; } || { echo 'FAIL readiness copy: nonphysical task root' >&2; exit 1; }
            chmod 0755 "$fixture_copy"
            git archive --format=tar HEAD | tar -xf - -C "$fixture_copy"
            test ! -e "$fixture_copy/app/config/config.php" || { echo 'FAIL readiness copy: runtime config present' >&2; exit 1; }
            fixture_checkout="$fixture_copy"
          fi
          sudo -u www-data -g www-data test -r "$fixture_checkout/app/tests/portal_westy_runs_mysql_test.php" || { echo 'FAIL readiness preflight: selected runs script unreadable as33' >&2; exit 1; }
          sudo -u www-data -g www-data test -r "$fixture_checkout/app/tests/portal_westy_control_mysql_test.php" || { echo 'FAIL readiness preflight: selected control script unreadable as33' >&2; exit 1; }
          (cd "$fixture_checkout"
          sudo -u www-data -g www-data env \
            SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER="$SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER" \
            SAFEHARBOR_WESTY_TEST_DB="$SAFEHARBOR_WESTY_TEST_DB" \
            SAFEHARBOR_WESTY_TEST_HOST="$SAFEHARBOR_WESTY_TEST_HOST" \
            SAFEHARBOR_WESTY_TEST_PORT="$SAFEHARBOR_WESTY_TEST_PORT" \
            SAFEHARBOR_WESTY_TEST_USER="$SAFEHARBOR_WESTY_TEST_USER" \
            SAFEHARBOR_WESTY_TEST_PASS="$SAFEHARBOR_WESTY_TEST_PASS" \
            php app/tests/portal_westy_runs_mysql_test.php
          )
          php app/tests/endpoint_tool_runs_migration_mysql_test.php
          php app/tests/endpoint_tool_runs_v2_migration_mysql_test.php
          (cd "$fixture_checkout"
          sudo -u www-data -g www-data env \
            SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER="$SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER" \
            SAFEHARBOR_WESTY_TEST_DB="$SAFEHARBOR_WESTY_TEST_DB" \
            SAFEHARBOR_WESTY_TEST_HOST="$SAFEHARBOR_WESTY_TEST_HOST" \
            SAFEHARBOR_WESTY_TEST_PORT="$SAFEHARBOR_WESTY_TEST_PORT" \
            SAFEHARBOR_WESTY_TEST_USER="$SAFEHARBOR_WESTY_TEST_USER" \
            SAFEHARBOR_WESTY_TEST_PASS="$SAFEHARBOR_WESTY_TEST_PASS" \
            php app/tests/portal_westy_control_mysql_test.php
          )
      - name: Reject shard runtime config after tests
        if: always()
        run: test ! -f app/config/config.php

  php-westy-portal:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: safeharbor-test-root
          MYSQL_DATABASE: safeharbor_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psafeharbor-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Test Westy workflow, mail, and AI delivery ownership
        env:
          SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_WESTY_TEST_DB: safeharbor_westy_test
          SAFEHARBOR_WESTY_TEST_HOST: 127.0.0.1
          SAFEHARBOR_WESTY_TEST_PORT: 3306
          SAFEHARBOR_WESTY_TEST_USER: root
          SAFEHARBOR_WESTY_TEST_PASS: safeharbor-test-root
        run: |
          php app/tests/westy_workflow_mysql_test.php
          php app/tests/westy_email_mysql_test.php
          php app/tests/westy_mail_mysql_test.php
          php app/tests/westy_mail_poll_mysql_test.php
          php app/tests/portal_westy_mysql_test.php
          php app/tests/portal_westy_ai_delivery_mysql_test.php
      - name: Test portal device access, workspace, and security ownership
        env:
          SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_WESTY_TEST_DB: safeharbor_westy_test
          SAFEHARBOR_WESTY_TEST_HOST: 127.0.0.1
          SAFEHARBOR_WESTY_TEST_PORT: 3306
          SAFEHARBOR_WESTY_TEST_USER: root
          SAFEHARBOR_WESTY_TEST_PASS: safeharbor-test-root
        run: |
          php app/tests/portal_devices_mysql_test.php
          php app/tests/portal_employee_device_access_mysql_test.php
          php app/tests/portal_access_mysql_test.php
          php app/tests/portal_workspace_mysql_test.php
          php app/tests/portal_stream_http_test.php
          php app/tests/portal_security_orders_test.php
      - name: Test private Westy feedback ownership, linkage, replay and erasure
        env:
          SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_WESTY_TEST_DB: safeharbor_westy_test
          SAFEHARBOR_WESTY_TEST_HOST: 127.0.0.1
          SAFEHARBOR_WESTY_TEST_PORT: 3306
          SAFEHARBOR_WESTY_TEST_USER: root
          SAFEHARBOR_WESTY_TEST_PASS: safeharbor-test-root
        run: php app/tests/portal_westy_feedback_mysql_test.php
      - name: Test customer mobile projection and real binding isolation
        env:
          SAFEHARBOR_WESTY_TEST_DISPOSABLE_SERVER: '1'
          SAFEHARBOR_WESTY_TEST_HOST: 127.0.0.1
          SAFEHARBOR_WESTY_TEST_PORT: '3306'
          SAFEHARBOR_WESTY_TEST_USER: root
          SAFEHARBOR_WESTY_TEST_PASS: safeharbor-test-root
          SAFEHARBOR_WESTY_TEST_DB: safeharbor_westy_test_mobile
        run: |
          php app/tests/portal_mobile_test.php
          php app/tests/portal_mobile_mysql_test.php
      - name: Reject shard runtime config after tests
        if: always()
        run: test ! -f app/config/config.php

  php-time:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: safeharbor-test-root
          MYSQL_DATABASE: safeharbor_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psafeharbor-test-root"
