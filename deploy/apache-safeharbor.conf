# Safeharbor — Apache vhost (port 80) for safeharbor.8westit.com
# Same shape as the box's other sites (incl. Milepost's support-8westit.conf):
# docroot = <app>/current/public, DirectoryIndex index.php index.html,
# AllowOverride All, certbot HTTPS redirect at the bottom.
# Install: sudo cp apache-safeharbor.conf /etc/apache2/sites-available/safeharbor-8westit.conf

<VirtualHost *:80>
    ServerName safeharbor.8westit.com
    ServerAlias www.safeharbor.8westit.com
    DocumentRoot /srv/8west/apps/safeharbor/current/public

    <Directory /srv/8west/apps/safeharbor/current/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # ---- security headers ----
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set Referrer-Policy strict-origin-when-cross-origin
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # ---- compression ----
    AddOutputFilterByType DEFLATE text/css application/javascript application/json image/svg+xml

    # ---- static assets: cache a week (cache-bust with ?v= like Milepost) ----
    <Directory /srv/8west/apps/safeharbor/current/public/assets>
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
        Header always set Cache-Control "public"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/safeharbor-8westit-error.log
    CustomLog ${APACHE_LOG_DIR}/safeharbor-8westit-access.log combined

    # certbot HTTPS redirect
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =safeharbor.8westit.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
