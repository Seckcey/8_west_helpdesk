# Safeharbor — Apache vhost for http(s)://safeharbor.8westit.com
# Install: sudo cp apache-safeharbor.conf /etc/apache2/sites-available/safeharbor-8westit.conf
#          sudo a2ensite safeharbor-8westit && sudo systemctl reload apache2
# TLS: sudo certbot --apache -d safeharbor.8westit.com --redirect
#      (certbot generates safeharbor-8westit-le-ssl.conf like the other sites)
#
# This file is ADDITIVE ONLY — it must never edit or shadow the existing
# 8westit / 8westventures / calc-8westbio / support (Milepost) vhosts.

<VirtualHost *:80>
    ServerName safeharbor.8westit.com
    DocumentRoot /var/www/safeharbor

    <Directory /var/www/safeharbor>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        # SPA fallback: unknown paths serve the app shell (client-side routing)
        FallbackResource /index.html
    </Directory>

    # ---- security headers ----
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set Referrer-Policy strict-origin-when-cross-origin
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # ---- compression ----
    AddOutputFilterByType DEFLATE text/css application/javascript application/json image/svg+xml application/manifest+json

    # ---- hashed build assets: cache forever ----
    <Directory /var/www/safeharbor/assets>
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header always set Cache-Control "public, immutable"
    </Directory>

    # ---- brand assets: cache a week ----
    <Directory /var/www/safeharbor/brand>
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </Directory>

    # ---- index.html: always fresh ----
    <FilesMatch "^index\.html$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/safeharbor-8westit-error.log
    CustomLog ${APACHE_LOG_DIR}/safeharbor-8westit-access.log combined
</VirtualHost>
