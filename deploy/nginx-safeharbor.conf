# Safeharbor — nginx site for https://safeharbor.8westit.com
# Install: sudo cp nginx-safeharbor.conf /etc/nginx/conf.d/safeharbor.conf
# TLS: certbot edits this file when you run deploy/README.md step 4.

server {
    listen 80;
    server_name safeharbor.8westit.com;

    root /var/www/safeharbor;
    index index.html;

    # ---- compression ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;
    gzip_vary on;

    # ---- security headers ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- hashed build assets: cache forever ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- brand assets: cache a week (they change only on rebrands) ----
    location /brand/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- SPA: always fresh index.html, client-side routing fallback ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
