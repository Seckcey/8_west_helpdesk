# Safeharbor — Apache vhost (port 443) for safeharbor.8westit.com
# Same directives as the port-80 vhost + the Let's Encrypt cert lines,
# matching the certbot-generated pattern used by the other sites on this box.
# Install: sudo cp apache-safeharbor-le-ssl.conf /etc/apache2/sites-available/safeharbor-8westit-le-ssl.conf

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName safeharbor.8westit.com
    ServerAlias www.safeharbor.8westit.com
    DocumentRoot /srv/8west/apps/safeharbor/current/public

    <Directory /srv/8west/apps/safeharbor/current/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # ---- security headers ----
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set Referrer-Policy strict-origin-when-cross-origin
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # ---- compression ----
    AddOutputFilterByType DEFLATE text/css application/javascript application/json image/svg+xml

    # ---- static assets: cache a week (cache-bust with ?v= like Milepost) ----
    <Directory /srv/8west/apps/safeharbor/current/public/assets>
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
        Header always set Cache-Control "public"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/safeharbor-8westit-error.log
    CustomLog ${APACHE_LOG_DIR}/safeharbor-8westit-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/safeharbor.8westit.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/safeharbor.8westit.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
